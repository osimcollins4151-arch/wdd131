<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Explore temples around the world with the filtered Temple Album."
    >
    <meta name="author" content="Collins Osim">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles/filtered-temples.css">
    <link rel="stylesheet" href="styles/filtered-temples-large.css">
    <script src="scripts/filtered-temples.js" defer></script>
    <title>Filtered Temple Album</title>
  </head>
  <body>
    <header>
      <h1>Temple Album</h1>
      <button
        class="menu-toggle"
        type="button"
        aria-controls="primary-navigation"
        aria-expanded="false"
        aria-label="Open navigation menu"
      >
        ☰
      </button>
      <nav id="primary-navigation" aria-label="Temple filters">
        <button type="button" data-filter="home" aria-pressed="true">Home</button>
        <button type="button" data-filter="old" aria-pressed="false">Old</button>
        <button type="button" data-filter="new" aria-pressed="false">New</button>
        <button type="button" data-filter="large" aria-pressed="false">Large</button>
        <button type="button" data-filter="small" aria-pressed="false">Small</button>
      </nav>
    </header>

    <main>
      <h2 id="filter-title">Home</h2>
      <section
        class="temple-gallery"
        id="temple-gallery"
        aria-label="Temple information"
      ></section>
    </main>

    <footer>
      <p>&copy; <span id="currentyear"></span> ❤️ Collins Osim ❤️ | Nigeria</p>
      <p id="lastModified"></p>
    </footer>
  </body>
</html>
