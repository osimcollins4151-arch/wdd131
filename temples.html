<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Temple Album by Collins Osim. A collection of temple photos."
    />
    <meta name="author" content="Collins Osim" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/temples.css" />
    <title>Temple Album</title>
  </head>
  <body>
    <script src="scripts/temples.js" defer></script>

    <header>
      <h1>Temple Album</h1>

      <button
        class="menu-toggle"
        type="button"
        aria-controls="primary-navigation"
        aria-expanded="false"
        aria-label="Open navigation menu"
      >
        ☰
      </button>

      <nav id="primary-navigation">
        <a href="home">Home</a>
        <a href="old">Old</a>
        <a href="new">New</a>
        <a href="Large">Large</a>
        <a href="small">Small</a>
      </nav>
    </header>

    <main>
      <h2>Home</h2>
      <section class="temple-gallery" aria-label="Temple photos">
        <figure>
          <img src="images/temple-photo.jpg" alt="Temple surrounded by trees" />
          <figcaption>Salt Lake Temple</figcaption>
        </figure>

        <figure>
          <img src="images/drone-photo.jpg" alt="Temple viewed from above" />
          <figcaption>Rome Italy Temple</figcaption>
        </figure>

        <figure>
          <img src="images/251-church.jpg" alt="Church building and grounds" />
          <figcaption>Rome Italy Temple</figcaption>
        </figure>

        <figure>
          <img src="images/temple720p.jpg" alt="Temple against the sky" />
          <figcaption>Rome Italy Temple</figcaption>
        </figure>

        <figure>
          <img src="images/famous.jpg" alt="Temple building" />
          <figcaption>Rome Italy Temple</figcaption>
        </figure>

        <figure>
          <img src="images/jesus-temple.jpg" alt="Temple architecture" />
          <figcaption>Rome Italy Temple</figcaption>
        </figure>

        <figure>
          <img src="images/church-of-christ.jpg" alt="Church building" />
          <figcaption>Rome Italy Temple</figcaption>
        </figure>

        <figure>
          <img src="images/jesus-temple.jpg" alt="Temple architecture" />
          <figcaption>Rome Italy Temple</figcaption>
        </figure>

        <figure>
          <img
            src="images/expiatory-church.jpg"
            alt="Expiatory church building"
          />
          <figcaption>Rome Italy Temple</figcaption>
        </figure>
      </section>
    </main>

    <footer>
      <p>&copy; <span id="currentyear"></span> ❤️ Collins Osim ❤️ | Nigeria</p>
      <p id="lastModified"></p>
    </footer>
  </body>
</html>
