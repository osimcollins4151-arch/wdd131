<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A collection of landscape photographs loaded as you scroll.">
    <meta name="author" content="Collins Osim">
    <title>Lazy Loading Images</title>
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>
<body>
    <main>
        <h1>Explore the Outdoors</h1>
        <img src="https://picsum.photos/seed/lazyload-1/400/600" alt="Mountain peaks beneath a wide open sky" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/seed/lazyload-2/400/600" alt="A quiet forest path" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/seed/lazyload-3/400/600" alt="Waves rolling onto a rocky coast" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/seed/lazyload-4/400/600" alt="A lake surrounded by hills" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/seed/lazyload-5/400/600" alt="Sunlight shining through tall trees" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/seed/lazyload-6/400/600" alt="A winding trail through the countryside" width="400" height="600" loading="lazy">
    </main>

    <footer>
        <p>&copy; 2026 Explore the Outdoors</p>
        <p>Last modified: <span id="last-modified"></span></p>
    </footer>
</body>
</html>
